<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario Backend</title>

    <style>
        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: #f3f0f7;
        }

        .contenedor {
            width: 360px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border: 1px solid #ccc;
        }

        h1 {
            text-align: center;
            color: #7e22ce;
            font-size: 22px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, textarea {
            width: 100%;
            padding: 6px;
            margin-top: 5px;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 8px;
            background-color: #7e22ce;
            color: white;
            border: none;
        }

        #respuesta {
            margin-top: 15px;
            text-align: center;
            color: green;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h1>Formulario de Contacto</h1>

        <form id="formulario">
            <label>Nombre:</label>
            <input type="text" id="nombre" required>

            <label>Email:</label>
            <input type="email" id="email" required>

            <label>Mensaje:</label>
            <textarea id="mensaje" required></textarea>

            <button type="submit">Enviar</button>
        </form>

        <p id="respuesta"></p>
    </div>

    <script src="script.js"></script>
</body>
</html>
